; Valores del entorno local de pruebas: los errores se muestran para que los vea el probador.
display_errors = On
log_errors = On
error_reporting = E_ALL
; Evita que un aviso mostrado rompa header() o session_start() en código antiguo.
output_buffering = 4096
; Añade aquí lo que exija el proyecto, por ejemplo short_open_tag = On.
