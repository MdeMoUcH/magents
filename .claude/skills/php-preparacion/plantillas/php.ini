; Los errores van al log: mostrados, romperían JSON, descargas y header() en código antiguo.
display_errors = Off
log_errors = On
error_reporting = E_ALL
; Descarta cualquier envío de mail(): el entorno no puede mandar correo real.
sendmail_path = "cat > /dev/null"
; Añade aquí lo que exija el proyecto, por ejemplo short_open_tag = On.
